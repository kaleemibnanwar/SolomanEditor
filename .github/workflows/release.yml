# Build, sign (when credentials are present) and publish a release, then mirror
# the installers to the source repo. The updater (`electron-updater` in
# `electron/main.cjs`) reads the `latest*.yml` feed from the PUBLIC repo
# (kaleemibnanwar/octocut), so electron-builder publishes there; the source repo
# gets a copy of the installers for archive/backup.
#
# Triggered by pushing a `v*` tag (or "Run workflow"). The version comes from
# `package.json`; bump it *and* tag it together, e.g. `pnpm version 0.1.0`.
#
# Secrets:
#   PUBLIC_REPO_TOKEN  (required)  PAT with `contents: write` on kaleemibnanwar/octocut
#   MAC_CSC_LINK / MAC_CSC_KEY_PASSWORD   (optional) base64 .p12 + password (macOS signing)
#   WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD   (optional) base64 .pfx + password (Windows signing)
#   APPLE_API_KEY_BASE64 / APPLE_API_KEY_ID / APPLE_API_ISSUER / APPLE_TEAM_ID
#        (optional) macOS notarization via App Store Connect API key (.p8 stored base64)
# Without the optional secrets the build still succeeds, just unsigned.

name: Build & Publish Multi-Platform Release Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_OPTIONS: "--max-old-space-size=8192"

jobs:
  build-release:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Source Code
        shell: bash
        run: |
          git config --global core.autocrlf false
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" .
          git checkout "${{ github.ref_name }}" || true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer
        run: pnpm build

      - name: Configure macOS signing + notarization
        if: runner.os == 'macOS'
        env:
          MAC_CSC_LINK_B64: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # Decode the .p12 (stored base64) to a file, then point CSC_LINK at the
          # path — avoids round-tripping a multi-KB base64 string through GITHUB_ENV.
          if [ -n "$MAC_CSC_LINK_B64" ]; then
            printf '%s' "$MAC_CSC_LINK_B64" | python3 -c 'import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.buffer.read()))' > "$RUNNER_TEMP/octocut.p12"
            echo "CSC_LINK=$RUNNER_TEMP/octocut.p12" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
          # The .p8 is multiline PEM, so it is stored base64 and decoded to a file
          # here — notarytool takes a path via the APPLE_API_KEY env var. python3
          # is present on all runners and avoids BSD/GNU `base64 -d`/`-D` ambiguity.
          if [ -n "$APPLE_API_KEY_BASE64" ]; then
            printf '%s' "$APPLE_API_KEY_BASE64" | python3 -c 'import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.buffer.read()))' > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      - name: Configure Windows signing
        if: runner.os == 'Windows'
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          "CSC_LINK=$env:CSC_LINK" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CSC_KEY_PASSWORD=$env:CSC_KEY_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build, sign and publish installers (public repo)
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        shell: bash
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "PUBLIC_REPO_TOKEN is required to publish updater assets to kaleemibnanwar/octocut" >&2
            exit 1
          fi
          pnpm exec electron-builder --publish always

      - name: Upload installers to the source repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v$(node -p "require('./package.json').version")"
          fi
          # `create` is idempotent-ish: three OS runners race to create the same
          # release, so ignore the "already exists" failure and just upload.
          gh release create "$TAG" --repo "${{ github.repository }}" \
            --title "Octo Cut $TAG" --notes "Release $TAG" || true
          find release -maxdepth 1 -type f ! -name 'builder-*' -print0 | \
            xargs -0 gh release upload "$TAG" --repo "${{ github.repository }}" --clobber
